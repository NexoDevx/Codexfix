name: Testes
on: {pull_request: {}, workflow_dispatch: {}}
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: index.html tem os módulos atuais
        run: node scripts/injetar-modulos.mjs --check
      - name: Testes (servidor, busca, pasta, execução real, modelos grátis)
        run: npm test
